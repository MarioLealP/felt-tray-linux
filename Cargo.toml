[workspace]
resolver = "3"
# Her body's logic: the felt-animation modules, one crate each (moved in from felt-animation-rust 02a2a80).
members = ["crates/*"]
# Plain `cargo build/test/clippy` (and CI) covers them too.
default-members = [".", "crates/*"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "felt-tray"
version = "0.9.2"
edition.workspace = true
publish.workspace = true

[dependencies]
# her body's logic (crates/)
felt-afk = { path = "crates/afk" }
felt-beat = { path = "crates/beat" }
felt-call-energy = { path = "crates/call-energy" }
felt-face-life = { path = "crates/face-life" }
felt-faces = { path = "crates/faces" }
felt-games = { path = "crates/games" }
felt-gaze = { path = "crates/gaze" }
felt-geometry = { path = "crates/geometry" }
felt-gpu = { path = "crates/gpu" }
felt-ledge-sit = { path = "crates/ledge-sit" }
felt-library = { path = "crates/library" }
felt-mood = { path = "crates/mood" }
felt-outfits = { path = "crates/outfits" }
felt-music-events = { path = "crates/music-events" }
felt-navigation = { path = "crates/navigation" }
felt-presence = { path = "crates/presence" }
felt-reaction-table = { path = "crates/reaction-table" }
felt-sounds = { path = "crates/sounds" }
felt-state = { path = "crates/state" }
felt-tone = { path = "crates/tone" }
felt-window-events = { path = "crates/window-events" }
felt-world = { path = "crates/world" }

anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
ksni = "0.3.6"
png = "0.18.1"
rand = "0.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
# the chat window's client-certificate answer (the one unsafe call, isolated)
felt-webkit-auth = { path = "crates/webkit-auth" }
wry = "0.57.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[lints]
workspace = true
