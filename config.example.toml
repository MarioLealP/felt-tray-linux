# felt-tray config - `felt-tray --init` writes this file to ~/.config/felt-tray/config.toml.
# Fill in your Felt server's details; felt-tray refuses to start while a required value is empty.

# felt-core's machine host: Caddy (or any TLS proxy) that requires the tray's client certificate and passes
# its identity to felt-core. Example: "https://felt-api.example.org"
felt_core_url = ""

# The hosted Felt app the chat window opens (behind your SSO). Example: "https://felt.example.org/app/"
app_url = ""

# The tray's client certificate: ONE PEM file with key + certificate + chain, replaced in place when renewed
# (felt-tray re-reads it when it changes). Your user must be able to read it.
client_bundle = ""

# Hosts the chat window may browse: the app's host and your SSO login host. Everything else opens in the
# default browser. Example: ["felt.example.org", "auth.example.org"]
window_hosts = []

# true = a tray icon (any StatusNotifierItem host: Plasma, waybar, GNOME + AppIndicator...).
# false = no icon, for a desktop shell with its own Felt button (it calls the D-Bus API org.clockmost.Felt).
tray_icon = true

# --- optional (defaults shown) ---

# Her alert lines as desktop notifications (with Details / Handled buttons).
# notices = true

# Her own lines (calendar heads-ups, alarms, things she noticed), spoken; shown as a notification when her voice
# is down.
# proactive = true

# Days of her calendar offered to a desktop shell's calendar (D-Bus property `Agenda`, JSON); 0 = off.
# Felt reminds you herself - the shell only shows.
# agenda_days = 14

# Chat window size in logical pixels.
# window_size = [800, 600]

# Plays her voice: a command that reads one WAV file on stdin (PipeWire's pw-play by default).
# player = ["pw-play", "--media-role", "Communication", "-"]

# React to what's on screen (KDE Plasma only: KWin's window list + per-window screenshots). Before anything
# is captured, the active window is checked against the blocklist; blocked or unidentified windows are never
# captured, and a missing/unreadable blocklist means no captures at all.
# screen_reactions = false
# capture_blocklist = "~/.config/felt-tray/capture_blocklist.toml"   (default: next to this file)
# screen_sample_s = 45

# Her body: felt-tray launches the Godot overlay that draws her and drives it (walking, sitting on windows,
# reacting). It talks to the overlay over a loopback port with a fresh secret each launch. Leave this table out
# for no body. KDE Plasma keeps her windows above the others (felt-tray's KWin script).
# [body]
# command = ["godot", "--display-driver", "wayland", "--path", "/path/to/felt-godot-overlay"]
# animations = "/path/to/felt-godot-overlay/animations/library"
# port = 8765
# data_dir = "/usr/share/felt-tray/body"
# rhubarb = ["rhubarb", "--recognizer", "phonetic"]      (times her mouth to her voice; package rhubarb-lip-sync)
