# cargo-deny: advisories, licences, bans, sources. `cargo deny check`
[graph]
all-features = true

[advisories]
# RustSec database; unmaintained/unsound crates are errors by default
yanked = "deny"

[licenses]
# permissive only; add a licence here deliberately, with a reason
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# our own unpublished crates (publish = false) need no licence check
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
