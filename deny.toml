# cargo-deny: advisories, licences, bans, sources. `cargo deny check`
[graph]
all-features = true

[advisories]
# RustSec database; unmaintained/unsound crates are errors by default
yanked = "deny"
ignore = [
    # proc-macro-error (unmaintained, build-time proc macro only) comes in through gtk-rs 0.18 (glib-macros), which
    # tao/wry still use for GTK3 on Linux. No fix until the Tauri stack moves to gtk4-rs.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via tao/wry's gtk-rs 0.18" },
    # zbus 6 folded zbus_names/zvariant/zvariant_derive into itself (2026-10-17). Unmaintained, no known bug; we stay
    # on zbus 5 while ksni (the tray icon, 0.3.6 latest) does - move both together when ksni takes zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; ksni still on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; ksni still on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; ksni still on zbus 5" },
]

[licenses]
# permissive only; add a licence here deliberately, with a reason
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # felt-tray: ksni (the tray icon) is public domain
    "Unlicense",
    # felt-tray: wry's HTML parsing (cssparser, selectors, dtoa-short) and option-ext; file-level copyleft,
    # unmodified dependencies - no obligation on our code
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# our own unpublished crates (publish = false) need no licence check
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# our own workspace crates (crates/, publish = false) are path dependencies, never from a registry
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
